<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Redirecting…</title></head>
<body>
<script>
  const path = window.location.pathname;
  if (/\/cv\/?$/i.test(path)) {
    window.location.replace(path.replace(/\/cv\/?$/i, '/Nofil-Khan-CV.pdf'));
  } else {
    document.body.textContent = 'Page not found.';
  }
</script>
</body>
</html>
